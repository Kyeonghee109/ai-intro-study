<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="760" height="430" rx="14" fill="#fff"/>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
</defs>
<!-- 층 라벨 -->
<g font-size="13" fill="#64748b" text-anchor="middle"><text x="120" y="70">입력</text><text x="270" y="70">은닉층</text><text x="420" y="70">출력(예측)</text></g>
<!-- 연결선 -->
<g stroke="#cbd5e1" stroke-width="1.5">
<line x1="120" y1="120" x2="270" y2="105"/><line x1="120" y1="120" x2="270" y2="165"/><line x1="120" y1="120" x2="270" y2="225"/>
<line x1="120" y1="210" x2="270" y2="105"/><line x1="120" y1="210" x2="270" y2="165"/><line x1="120" y1="210" x2="270" y2="225"/>
<line x1="270" y1="105" x2="420" y2="165"/><line x1="270" y1="165" x2="420" y2="165"/><line x1="270" y1="225" x2="420" y2="165"/>
</g>
<g fill="#e0e7ff" stroke="#6366f1" stroke-width="2">
<circle cx="120" cy="120" r="16"/><circle cx="120" cy="210" r="16"/>
<circle cx="270" cy="105" r="16"/><circle cx="270" cy="165" r="16"/><circle cx="270" cy="225" r="16"/>
<circle cx="420" cy="165" r="18"/></g>
<text x="420" y="170" font-size="13" text-anchor="middle" fill="#312e81">0.3</text>
<text x="195" y="150" font-size="12" fill="#6366f1" text-anchor="middle">w</text>
<!-- 정답/손실 -->
<rect x="530" y="95" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="625" y="122" font-size="14" text-anchor="middle" fill="#334155">정답: 1.0</text>
<rect x="530" y="185" width="190" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="625" y="209" font-size="15" font-weight="700" text-anchor="middle" fill="#92400e">② 손실 = 0.7만큼 틀림</text>
<text x="625" y="229" font-size="12" text-anchor="middle" fill="#92400e">예측과 정답 차이를 숫자로</text>
<line x1="440" y1="165" x2="525" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="625" y1="139" x2="625" y2="182" stroke="#475569" stroke-width="1.5" marker-end="url(#g)"/>
<!-- 순전파 -->
<line x1="100" y1="35" x2="440" y2="35" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
<text x="270" y="25" font-size="15" font-weight="700" text-anchor="middle" fill="#2563eb">① 순전파: 입력 → 출력 방향으로 계산해 예측을 냄</text>
<!-- 역전파 -->
<path d="M600 245 C600 300 520 290 440 290 L100 290" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
<text x="300" y="282" font-size="15" font-weight="700" text-anchor="middle" fill="#dc2626">③ 역전파: 오차를 출력 → 입력 방향으로 거꾸로 보냄</text>
<text x="300" y="310" font-size="12" text-anchor="middle" fill="#dc2626">"이 가중치 때문에 얼마나 틀렸나"를 층마다 나눠 알려 줌</text>
<!-- 업데이트 -->
<rect x="60" y="335" width="420" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="270" y="359" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">④ 가중치 업데이트 (경사하강법)</text>
<text x="270" y="379" font-size="12" text-anchor="middle" fill="#166534">손실이 줄어드는 쪽으로 모든 w를 조금씩 고침</text>
<!-- 반복 -->
<path d="M60 363 C15 363 15 120 95 120" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
<text x="520" y="360" font-size="14" font-weight="700" fill="#475569">🔁 다시 ①부터</text>
<text x="520" y="380" font-size="12" fill="#475569">손실이 더 안 줄 때까지 반복</text>
</svg>
