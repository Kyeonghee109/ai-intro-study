<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="760" height="400" rx="14" fill="#fff"/>
<text x="380" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#334155">혼동 행렬 — 스팸 필터로 예를 들면 (양성 = 스팸)</text>
<text x="380" y="52" font-size="12" text-anchor="middle" fill="#64748b">앞 글자 True/False = 모델이 맞혔나? · 뒷 글자 Positive/Negative = 모델이 뭐라고 했나?</text>
<text x="380" y="86" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">모델의 예측</text>
<text x="290" y="108" font-size="13" text-anchor="middle" fill="#334155">"스팸이다" (양성)</text>
<text x="500" y="108" font-size="13" text-anchor="middle" fill="#334155">"정상이다" (음성)</text>
<text x="70" y="198" font-size="13" font-weight="700" text-anchor="middle" fill="#334155" transform="rotate(-90 70 198)">실제 정답</text>
<text x="132" y="163" font-size="13" text-anchor="middle" fill="#334155">진짜 스팸</text>
<text x="132" y="243" font-size="13" text-anchor="middle" fill="#334155">진짜 정상</text>
<rect x="185" y="118" width="210" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="290" y="145" font-size="16" font-weight="800" text-anchor="middle" fill="#166534">TP 참 양성</text><text x="290" y="167" font-size="12" text-anchor="middle" fill="#166534">스팸을 스팸이라고 맞힘 ✔</text><text x="290" y="186" font-size="12" text-anchor="middle" fill="#166534">예: 40통</text>
<rect x="395" y="118" width="210" height="80" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="500" y="145" font-size="16" font-weight="800" text-anchor="middle" fill="#991b1b">FN 거짓 음성</text><text x="500" y="167" font-size="12" text-anchor="middle" fill="#991b1b">스팸을 놓침 ✘</text><text x="500" y="186" font-size="12" text-anchor="middle" fill="#991b1b">예: 10통</text>
<rect x="185" y="198" width="210" height="80" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="290" y="225" font-size="16" font-weight="800" text-anchor="middle" fill="#991b1b">FP 거짓 양성</text><text x="290" y="247" font-size="12" text-anchor="middle" fill="#991b1b">정상 메일을 스팸 처리 ✘</text><text x="290" y="266" font-size="12" text-anchor="middle" fill="#991b1b">예: 5통</text>
<rect x="395" y="198" width="210" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="500" y="225" font-size="16" font-weight="800" text-anchor="middle" fill="#166534">TN 참 음성</text><text x="500" y="247" font-size="12" text-anchor="middle" fill="#166534">정상을 정상이라고 맞힘 ✔</text><text x="500" y="266" font-size="12" text-anchor="middle" fill="#166534">예: 45통</text>
<g font-size="13" fill="#334155">
<text x="40" y="310"><tspan font-weight="700" fill="#2563eb">정밀도</tspan> = TP/(TP+FP) = 40/45 ≈ 0.89  → "스팸이라고 한 것" 중 진짜 스팸 비율 (왼쪽 세로줄)</text>
<text x="40" y="334"><tspan font-weight="700" fill="#2563eb">재현율</tspan> = TP/(TP+FN) = 40/50 = 0.8  → "진짜 스팸" 중 잡아낸 비율 (위쪽 가로줄)</text>
<text x="40" y="358"><tspan font-weight="700" fill="#2563eb">정확도</tspan> = 맞힌 것/전체 = (40+45)/100 = 0.85  → 초록 칸 합 ÷ 전체</text>
</g>
<text x="380" y="388" font-size="11" text-anchor="middle" fill="#94a3b8">스팸 필터와 숫자는 이해를 돕는 예시예요.</text>
</svg>
