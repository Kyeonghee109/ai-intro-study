<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="760" height="300" rx="14" fill="#fff"/>
<text x="380" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#334155">나누는 기준 = 언제, 무엇에 쓰느냐</text>
<text x="380" y="50" font-size="12" text-anchor="middle" fill="#64748b">같은 데이터 묶음을 세 덩어리로 갈라서 서로 섞이지 않게 해요</text>
<rect x="40" y="65" width="360" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="220" y="90" font-size="15" font-weight="700" text-anchor="middle" fill="#1e40af">훈련 세트</text>
<rect x="405" y="65" width="150" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="480" y="90" font-size="15" font-weight="700" text-anchor="middle" fill="#92400e">검증 세트</text>
<rect x="560" y="65" width="160" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="640" y="90" font-size="15" font-weight="700" text-anchor="middle" fill="#991b1b">테스트 세트</text>
<g font-size="13" text-anchor="middle">
<text x="220" y="135" font-weight="700" fill="#1e40af">📘 교과서·문제집</text>
<text x="220" y="157" fill="#334155">가중치를 고치는 데 써요</text>
<text x="220" y="177" fill="#334155">(순전파→손실→역전파→업데이트)</text>
<text x="480" y="135" font-weight="700" fill="#92400e">📝 모의고사</text>
<text x="480" y="157" fill="#334155">설정을 바꿔 보며</text>
<text x="480" y="177" fill="#334155">어느 쪽이 나은지 비교</text>
<text x="640" y="135" font-weight="700" fill="#991b1b">🎓 수능</text>
<text x="640" y="157" fill="#334155">맨 마지막에 딱 한 번</text>
<text x="640" y="177" fill="#334155">진짜 실력을 재요</text></g>
<line x1="40" y1="205" x2="720" y2="205" stroke="#e2e8f0"/>
<text x="380" y="232" font-size="13" text-anchor="middle" fill="#334155">검증·테스트 세트는 가중치를 고치는 데 쓰지 않아요 → 처음 보는 문제로 평가하는 셈이에요</text>
<text x="380" y="256" font-size="13" text-anchor="middle" fill="#334155">테스트 데이터를 훈련에 넣으면 수능 문제를 미리 보고 공부한 것과 같아요 → 점수를 믿을 수 없어요</text>
<text x="380" y="283" font-size="11" text-anchor="middle" fill="#94a3b8">칸 길이는 이해를 돕는 예시예요. 나누는 비율은 수업 자료에 나오지 않아요.</text>
</svg>
